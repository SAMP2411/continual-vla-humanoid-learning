[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lifelong-vla-prototype"
version = "0.1.0"
description = "A compact continual-learning benchmark for a VLA-style robot policy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Samarth Patel"}]
dependencies = [
  "torch>=2.2,<3",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["ruff>=0.16,<0.17"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["lifelong_vla*"]
